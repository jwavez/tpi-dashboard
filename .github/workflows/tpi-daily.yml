name: Daily TPI Discord Update

on:
  schedule:
    - cron: "17 8 * * *"   # 08:17 UTC
    - cron: "17 9 * * *"   # backup 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance matplotlib numpy pandas

      - name: Run TPI and post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STREAMLIT_URL: https://tradersedge-tpi.streamlit.app/
        run: python TPIindi.py

      - name: Commit paper book files
        run: |
          git config user.name "TPI Bot"
          git config user.email "tpi-bot@users.noreply.github.com"
          git add tpi_paper_book.json tpi_paper_trades.csv tpi_paper_equity.csv tpi_history.json btc_dominance_history.json || true
          if git diff --staged --quiet; then
            echo "No paper book changes to commit"
          else
            git commit -m "Update TPI paper book $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
