name: Daily TPI Discord Update

on:
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC every day
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance matplotlib numpy pandas

      - name: Run TPI and post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STREAMLIT_URL: https://tradersedge-tpi.streamlit.app/
        run: python TPIindi.py
